# 应用名称，用于日志标识和运行监控。
spring.application.name=running-webgis-api

# 默认路径相对于 JVM 启动目录；从 backend_springboot/api 启动时指向项目派生数据目录。
# ${环境变量:默认值}：部署时可用 RUNNING_WEBGIS_DATA_DIR 覆盖为绝对路径。
running-webgis.data-directory=${RUNNING_WEBGIS_DATA_DIR:../../data/processed}
# 与 RunningWebgisProperties.allowedOrigins 绑定；不同主机名属于不同的浏览器来源。
running-webgis.allowed-origins[0]=http://localhost:5173
running-webgis.allowed-origins[1]=http://127.0.0.1:5173

# 只公开 Actuator 的健康和信息端点；不在此处开放其他管理端点。
management.endpoints.web.exposure.include=health,info
